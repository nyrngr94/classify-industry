<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <div id="app" style="padding:20px;font-family:Arial;">Loading...</div>
    <script src="./ZohoEmbededAppSDK.min.js"></script>
    <script>
    ZOHO.embeddedApp.on("PageLoad", function(data) {

        var recId = data.EntityId[0];

        document.getElementById("app").innerHTML = '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;min-width:360px;"><div style="font-size:16px;color:#444;margin-bottom:8px;">Analyzing website...</div><div style="font-size:13px;color:#888;">Fetching pages and classifying industry</div><div style="margin-top:20px;"><div class="spinner"></div></div></div>';

        ZOHO.CRM.FUNCTIONS.execute("classifywebsite1", {
            arguments: JSON.stringify({ accountId: recId.toString() })
        }).then(function(response) {

            var result;
            try {
                var raw = response.details.output;
                result = JSON.parse(raw);
            } catch(e) {
                showError("Could not parse result: " + JSON.stringify(response));
                return;
            }

            if(result.error) {
                showError(result.error);
                return;
            }

            document.getElementById("app").innerHTML =
                '<div style="font-family:Arial,sans-serif;padding:24px;min-width:400px;">' +
                '<div style="font-size:17px;font-weight:bold;color:#222;margin-bottom:6px;">Industry Classification</div>' +
                '<div style="font-size:13px;color:#888;margin-bottom:20px;">Based on: ' + result.website + '</div>' +
                '<table style="width:100%;border-collapse:collapse;font-size:15px;">' +
                '<tr style="background:#f5f5f5;"><td style="padding:10px 12px;color:#555;width:140px;">SIC Code</td><td style="padding:10px 12px;font-weight:bold;color:#222;">' + result.sic_code + '</td></tr>' +
                '<tr><td style="padding:10px 12px;color:#555;">SIC Description</td><td style="padding:10px 12px;font-weight:bold;color:#222;">' + result.sic_name + '</td></tr>' +
                '<tr style="background:#f5f5f5;"><td style="padding:10px 12px;color:#555;">NAICS Code</td><td style="padding:10px 12px;font-weight:bold;color:#222;">' + result.naics_code + '</td></tr>' +
                '<tr><td style="padding:10px 12px;color:#555;">NAICS Description</td><td style="padding:10px 12px;font-weight:bold;color:#222;">' + result.naics_name + '</td></tr>' +
                '</table>' +
                '<div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;">' +
                '<button onclick="cancelAction()" style="padding:9px 20px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#444;font-size:14px;cursor:pointer;">Cancel</button>' +
                '<button onclick="confirmSave()" style="padding:9px 20px;border:none;border-radius:4px;background:#0066cc;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;">Save to Record</button>' +
                '</div></div>';

            window.confirmSave = function() {
                document.getElementById("app").innerHTML = '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;"><div style="font-size:15px;color:#444;">Saving...</div></div>';
                ZOHO.CRM.FUNCTIONS.execute("saveClassification", {
                    arguments: JSON.stringify({
                        accountId:  recId.toString(),
                        sicCode:    result.sic_code,
                        sicName:    result.sic_name,
                        naicsCode:  result.naics_code,
                        naicsName:  result.naics_name
                    })
                }).then(function() {
                    document.getElementById("app").innerHTML =
                        '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;">' +
                        '<div style="font-size:22px;color:#2e7d32;margin-bottom:8px;">&#10003;</div>' +
                        '<div style="font-size:15px;font-weight:bold;color:#222;">Saved successfully</div>' +
                        '<div style="font-size:13px;color:#888;margin-top:6px;">SIC ' + result.sic_code + ' &middot; NAICS ' + result.naics_code + '</div>' +
                        '</div>';
                    setTimeout(function() { ZOHO.CRM.UI.Popup.close(); }, 2000);
                });
            };

            window.cancelAction = function() {
                ZOHO.CRM.UI.Popup.close();
            };

        }).catch(function(err) {
            showError("Function call failed: " + JSON.stringify(err));
        });

        function showError(msg) {
            document.getElementById("app").innerHTML =
                '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;">' +
                '<div style="font-size:15px;color:#c62828;">' + msg + '</div>' +
                '<button onclick="ZOHO.CRM.UI.Popup.close()" style="margin-top:16px;padding:8px 20px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;">Close</button>' +
                '</div>';
        }
    });

    ZOHO.embeddedApp.init();
    </script>
    <style>
        .spinner { width:32px;height:32px;margin:0 auto;border:3px solid #e0e0e0;border-top:3px solid #0066cc;border-radius:50%;animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</body>
</html>
