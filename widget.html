<!DOCTYPE html>
<html>
<head>
</head>
<body>
    <div id="app" style="padding:20px;font-family:Arial;">Loading...</div>
    <script src="./ZohoEmbededAppSDK.min.js"></script>
    <script>
    ZOHO.embeddedApp.on("PageLoad", function(data) {

        var recId = data.EntityId[0];

        function showLoading(msg) {
            document.getElementById("app").innerHTML =
                '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;min-width:360px;">' +
                '<div style="font-size:16px;color:#444;margin-bottom:8px;">' + msg + '</div>' +
                '<div style="font-size:13px;color:#888;">Targeting services, about, and product pages...</div>' +
                '<div style="margin-top:20px;"><div class="spinner"></div></div>' +
                '</div>';
        }

        function showError(msg) {
            document.getElementById("app").innerHTML =
                '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;">' +
                '<div style="font-size:15px;color:#c62828;">' + msg + '</div>' +
                '<button onclick="ZOHO.CRM.UI.Popup.close()" style="margin-top:16px;padding:8px 20px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;">Close</button>' +
                '</div>';
        }

        function confidenceBadge(level) {
            var color = level === "high" ? "#2e7d32" : level === "medium" ? "#e65100" : "#c62828";
            var bg = level === "high" ? "#e8f5e9" : level === "medium" ? "#fff3e0" : "#ffebee";
            return '<span style="display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:bold;color:' + color + ';background:' + bg + ';text-transform:uppercase;">' + (level || "unknown") + ' confidence</span>';
        }

        function showExisting(result) {
            document.getElementById("app").innerHTML =
                '<div style="font-family:Arial,sans-serif;padding:24px;min-width:420px;">' +
                '<div style="font-size:17px;font-weight:bold;color:#222;margin-bottom:6px;">Existing Classification Found</div>' +
                '<div style="font-size:13px;color:#888;margin-bottom:16px;">This record already has SIC and NAICS codes assigned.</div>' +

                '<table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:20px;">' +
                '<tr style="background:#f5f5f5;"><td style="padding:9px 12px;color:#555;width:130px;">SIC Code</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.sic_code + '</td></tr>' +
                '<tr><td style="padding:9px 12px;color:#555;">SIC Description</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.sic_name + '</td></tr>' +
                '<tr style="background:#f5f5f5;"><td style="padding:9px 12px;color:#555;">NAICS Code</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.naics_code + '</td></tr>' +
                '<tr><td style="padding:9px 12px;color:#555;">NAICS Description</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.naics_name + '</td></tr>' +
                '</table>' +

                '<div style="font-size:14px;color:#444;margin-bottom:16px;">Would you like to keep these codes or have Claude re-classify this company?</div>' +

                '<div style="display:flex;gap:10px;justify-content:flex-end;">' +
                '<button onclick="ZOHO.CRM.UI.Popup.close()" style="padding:9px 18px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#444;font-size:14px;cursor:pointer;">Keep Existing</button>' +
                '<button onclick="doFreshClassify()" style="padding:9px 18px;border:none;border-radius:4px;background:#0066cc;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;">Re-classify</button>' +
                '</div></div>';

            window.doFreshClassify = function() {
                showLoading("Fetching pages and analyzing...");
                runClassify("reclassify");
            };
        }

        function showResult(result) {
            document.getElementById("app").innerHTML =
                '<div style="font-family:Arial,sans-serif;padding:24px;min-width:440px;">' +
                '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
                '<div style="font-size:17px;font-weight:bold;color:#222;">Industry Classification</div>' +
                confidenceBadge(result.confidence) +
                '</div>' +
                '<div style="font-size:12px;color:#888;margin-bottom:12px;">Based on: <a href="' + result.website + '" target="_blank" style="color:#0066cc;">' + result.website + '</a></div>' +

                '<div style="background:#f0f7ff;border-left:3px solid #0066cc;padding:10px 14px;margin-bottom:10px;border-radius:0 4px 4px 0;">' +
                '<div style="font-size:11px;color:#555;margin-bottom:4px;font-weight:bold;text-transform:uppercase;">What Claude thinks this company does:</div>' +
                '<div style="font-size:13px;color:#333;">' + (result.summary || "No summary available.") + '</div>' +
                '</div>' +

                (result.evidence ? '<div style="background:#f9f9f9;border-left:3px solid #aaa;padding:8px 12px;margin-bottom:12px;border-radius:0 4px 4px 0;">' +
                '<div style="font-size:11px;color:#777;margin-bottom:2px;font-weight:bold;text-transform:uppercase;">Evidence source:</div>' +
                '<div style="font-size:12px;color:#555;">' + result.evidence + '</div>' +
                '</div>' : '') +

                '<table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px;">' +
                '<tr style="background:#f5f5f5;"><td style="padding:9px 12px;color:#555;width:130px;">SIC Code</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.sic_code + '</td></tr>' +
                '<tr><td style="padding:9px 12px;color:#555;">SIC Description</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.sic_name + '</td></tr>' +
                '<tr style="background:#f5f5f5;"><td style="padding:9px 12px;color:#555;">NAICS Code</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.naics_code + '</td></tr>' +
                '<tr><td style="padding:9px 12px;color:#555;">NAICS Description</td><td style="padding:9px 12px;font-weight:bold;color:#222;">' + result.naics_name + '</td></tr>' +
                '</table>' +

                '<div style="margin-bottom:16px;">' +
                '<div style="font-size:13px;color:#555;margin-bottom:6px;">Not accurate? Describe what this company actually does and re-classify:</div>' +
                '<textarea id="hintBox" placeholder="e.g. This company installs and repairs residential plumbing systems in the Dallas area..." style="width:100%;height:70px;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-family:Arial;box-sizing:border-box;resize:vertical;"></textarea>' +
                '</div>' +

                '<div style="display:flex;gap:10px;justify-content:flex-end;">' +
                '<button onclick="ZOHO.CRM.UI.Popup.close()" style="padding:9px 18px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#444;font-size:14px;cursor:pointer;">Cancel</button>' +
                '<button onclick="doReclassify()" style="padding:9px 18px;border:1px solid #0066cc;border-radius:4px;background:#fff;color:#0066cc;font-size:14px;cursor:pointer;">Re-classify</button>' +
                '<button onclick="doSave()" style="padding:9px 18px;border:none;border-radius:4px;background:#0066cc;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;">Save to Record</button>' +
                '</div></div>';

            window.doSave = function() {
                document.getElementById("app").innerHTML = '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;"><div style="font-size:15px;color:#444;">Saving...</div></div>';
                ZOHO.CRM.FUNCTIONS.execute("saveclassification", {
                    arguments: JSON.stringify({
                        accountId:  recId.toString(),
                        sicCode:    result.sic_code,
                        sicName:    result.sic_name,
                        naicsCode:  result.naics_code,
                        naicsName:  result.naics_name
                    })
                }).then(function() {
                    document.getElementById("app").innerHTML =
                        '<div style="font-family:Arial,sans-serif;padding:24px;text-align:center;">' +
                        '<div style="font-size:22px;color:#2e7d32;margin-bottom:8px;">&#10003;</div>' +
                        '<div style="font-size:15px;font-weight:bold;color:#222;">Saved successfully</div>' +
                        '<div style="font-size:13px;color:#888;margin-top:6px;">SIC ' + result.sic_code + ' &middot; NAICS ' + result.naics_code + '</div>' +
                        '</div>';
                    setTimeout(function() { ZOHO.CRM.UI.Popup.close(); }, 2000);
                }).catch(function(err) {
                    showError("Save failed: " + JSON.stringify(err));
                });
            };

            window.doReclassify = function() {
                var hint = document.getElementById("hintBox").value.trim();
                if(hint == "") {
                    document.getElementById("hintBox").style.border = "1px solid #c62828";
                    document.getElementById("hintBox").placeholder = "Please describe what this company does before re-classifying...";
                    return;
                }
                showLoading("Re-classifying with your feedback...");
                runClassify(hint);
            };
        }

        function runClassify(hint) {
            ZOHO.CRM.FUNCTIONS.execute("classifywebsite1", {
                arguments: JSON.stringify({
                    accountId: recId.toString(),
                    hint: hint || ""
                })
            }).then(function(response) {
                var result;
                try {
                    var raw = response.details.output;
                    result = JSON.parse(raw);
                } catch(e) {
                    showError("Could not parse result: " + JSON.stringify(response));
                    return;
                }
                if(result.error) {
                    showError(result.error);
                    return;
                }
                if(result.existing === "true") {
                    showExisting(result);
                } else {
                    showResult(result);
                }
            }).catch(function(err) {
                showError("Function call failed: " + JSON.stringify(err));
            });
        }

        showLoading("Fetching pages and analyzing...");
        runClassify("");

    });

    ZOHO.embeddedApp.init();
    </script>
    <style>
        .spinner { width:32px;height:32px;margin:0 auto;border:3px solid #e0e0e0;border-top:3px solid #0066cc;border-radius:50%;animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</body>
</html>
